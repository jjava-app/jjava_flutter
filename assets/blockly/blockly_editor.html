<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블록클리 테스트 페이지</title>
    <link rel="stylesheet" href="blockly_style.css" />
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>
<div id="blocklyDiv" style="height: 100vh; width: 100%">
    <xml id="toolbox">
        <!-- Logic -->
        <category name="Logic" colour="#5C81A6">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
            <block type="logic_operation">
                <field name="OP">AND</field>
            </block>
            <block type="logic_operation">
                <field name="OP">OR</field>
            </block>
            <block type="logic_boolean">
                <field name="BOOL">TRUE</field>
            </block>
            <block type="logic_boolean">
                <field name="BOOL">FALSE</field>
            </block>
            <block type="logic_negate"></block>
            <block type="logic_null"></block>
            <block type="logic_ternary"></block>
        </category>

        <!-- Math -->
        <category name="Math" colour="#5CA65C">
            <block type="math_number"></block>
            <block type="math_arithmetic"></block>
            <block type="math_single"></block>
            <block type="math_trig"></block>
            <block type="math_constant"></block>
            <block type="math_number_property"></block>
            <block type="math_round"></block>
            <block type="math_on_list"></block>
            <block type="math_modulo"></block>
            <block type="math_constrain"></block>
        </category>

        <!-- Text -->
        <category name="Text" colour="#5CA68D">
            <block type="text"></block>
            <block type="text_print">
                <value name="TEXT">
                    <shadow type="text">
                        <field name="TEXT">Hello, World!</field>
                    </shadow>
                </value>
            </block>
            <block type="text_join"></block>
            <block type="text_length"></block>
            <block type="text_isEmpty"></block>
            <block type="text_indexOf"></block>
            <block type="text_charAt"></block>
            <block type="text_getSubstring"></block>
            <block type="text_changeCase"></block>
            <block type="text_trim"></block>
        </category>

        <!-- Loops -->
        <category name="Loops" colour="#5CA699">
            <block type="controls_repeat_ext"></block>
            <block type="controls_whileUntil"></block>
            <block type="controls_for"></block>
            <block type="controls_forEach"></block>
            <block type="controls_flow_statements"></block>
        </category>

        <!-- Lists -->
        <category name="Lists" colour="#745CA6">
            <block type="lists_create_empty"></block>
            <block type="lists_create_with"></block>
            <block type="lists_repeat"></block>
            <block type="lists_length"></block>
            <block type="lists_isEmpty"></block>
            <block type="lists_indexOf"></block>
            <block type="lists_getIndex"></block>
            <block type="lists_setIndex"></block>
            <block type="lists_getSublist"></block>
        </category>

        <!-- Variables -->
        <category
                name="Variables"
                custom="VARIABLE"
                colour="#A6745C"
        ></category>

        <!-- Functions -->
        <category
                name="Functions"
                custom="PROCEDURE"
                colour="#A65C81"
        ></category>
    </xml>
</div>

    // The toolbox gets passed to the configuration options during injection.
    const workspace = Blockly.inject(document.getElementById("blocklyDiv"), {
      toolbox: document.getElementById("toolbox"),
      toolboxPosition: "end",
      horizontalLayout: true,
      collapse: true,
      comments: true,
      sounds: false,
      scrollbars: false,
      move: { drag: true, wheel: false },
      zoom: {
        controls: false,
        wheel: false,
        startScale: 1.0,
        maxScale: 3,
        minScale: 0.3,
        scaleSpeed: 1.2,
        pinch: true,
      },
      trashcan: false,
    });

    // === 1) 플라이아웃 자동 닫힘 방지 ===
    const flyout = workspace.getFlyout();
    if (flyout) {
      if (typeof flyout.setAutoClose === "function") {
        flyout.setAutoClose(false); // 공식 API
      } else {
        flyout.autoClose = false; // fallback
      }
    }

    // === 2) 첫 번째 카테고리 자동 선택 ===
    function selectCategoryByIndex(ws, index = 0) {
      const tb = ws.getToolbox();
      if (!tb) return;

      const items = tb
        .getToolboxItems()
        .filter((i) => typeof i.getContents === "function");
      if (items.length > index) {
        tb.setSelectedItem(items[index]);
      }
    }
    // inject 직후 실행
    setTimeout(() => selectCategoryByIndex(workspace, 0), 100);

    // === 3) 같은 카테고리 클릭해도 접히지 않게 오버라이드 ===
    class AlwaysOpenCategory extends Blockly.ToolboxCategory {
      onClick_(e) {
        if (e) {
          e.preventDefault?.();
          e.stopPropagation?.();
        }
        const tb = this.getToolbox();
        const ws = tb.getWorkspace();
        const flyout = ws.getFlyout();

        // 이미 선택된 경우 → 그냥 다시 show()
        if (this.isSelected && this.isSelected()) {
          if (flyout && typeof this.getContents === "function") {
            flyout.show(this.getContents());
          }
          return;
        }
        tb.setSelectedItem(this);
      }
    }

    // 기본 ToolboxCategory 덮어쓰기
